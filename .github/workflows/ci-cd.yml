name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: got-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  publish:
    name: Publish Docker image
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/got-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/got-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    needs: publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gotcli.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known host
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Verify SSH key and remote access
        run: |
          ssh-add -l
          ssh -T -o BatchMode=yes -o IdentitiesOnly=no "$DEPLOY_USER@$DEPLOY_HOST" 'id && docker version --format "{{.Server.Version}}"'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Pull and restart Docker container
        run: |
          ssh -T -o BatchMode=yes -o IdentitiesOnly=no "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
          set -e
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          docker stop got-web 2>/dev/null || true
          docker rm got-web 2>/dev/null || true
          docker run -d \\
            --name got-web \\
            --restart unless-stopped \\
            --publish 80:80 \\
            "$IMAGE_NAME:$IMAGE_TAG"
          EOF
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/got-web
          IMAGE_TAG: ${{ github.sha }}

      - name: Verify running container
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker ps --filter name=got-web --filter status=running --format '{{.Names}}' | grep -Fx got-web"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}